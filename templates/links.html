<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links &mdash; FRBC</title>
    <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <link rel="manifest" href="/static/site.webmanifest" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }

        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            padding: clamp(20px, 4vw, 48px) clamp(16px, 6vw, 64px);
        }

        .back-link {
            display: inline-block;
            color: #888;
            text-decoration: none;
            font-size: clamp(13px, 1.4vw, 16px);
            margin-bottom: clamp(20px, 3vw, 36px);
        }

        .back-link:hover { color: #33FF57; }

        h1 {
            font-size: clamp(24px, 3.2vw, 36px);
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 14px;
            margin-bottom: clamp(20px, 3vw, 36px);
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 1.8vw, 18px);
            max-width: 640px;
        }

        .link-button {
            display: block;
            font-size: clamp(17px, 2vw, 22px);
            font-weight: bold;
            color: #33FF57;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            background-color: #0a0a0a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 16px 20px;
            transition: border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }

        .link-button:hover {
            border-color: #33FF57;
            background-color: rgba(51, 255, 87, 0.08);
            color: #fff;
        }
    </style>
</head>
<body>

<a href="/" class="back-link">&larr; Back to dashboard</a>

<h1>Links</h1>

<div class="link-list">
    <a class="link-button" href="https://docs.google.com/forms/d/e/1FAIpQLSdsuWobvXfYjHm-lmqi8OTXx1oeicnnQi1sXoLWngWTdSIa-Q/viewform?pli=1" target="_blank" rel="noopener">FRBC Incident report</a>

    <a class="link-button" href="https://pla.co.uk/resolver" target="_blank" rel="noopener">PLA incident report</a>

    <a class="link-button" href="https://andrewdoughty.com/distances/" target="_blank" rel="noopener">FRBC rowing distances</a>

    <a class="link-button" href="https://www.fulhamreachboatclub.co.uk/safety" target="_blank" rel="noopener">Safety</a>

    <a class="link-button" href="https://pla.co.uk/tideway-code" target="_blank" rel="noopener">Tideway Code</a>

    <a class="link-button" href="/calendar">14 day calendar</a>

    <a class="link-button" href="https://fairweather-sculler.onrender.com/" target="_blank" rel="noopener">Fairweather Sculler</a>
</div>

</body>
</html>
