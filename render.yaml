services:
  - type: web
    name: hammersmith-tide-monitor
    env: python
    buildCommand: pip install -r requirements.txt
    envVars:
      - key: METOFFICE_NSWWS
        sync: false
      - key: METOFFICE_NSWWS_FEED_URL
        sync: false
      - key: METOFFICE_SITESPECIFIC
        sync: false
      - key: METOFFICE_ATMOSPHERIC
        sync: false
      - key: METOFFICE_OBSERVATIONS
        sync: false
      - key: TIDE_API_KEY
        sync: false
      - key: GOOGLE_CALENDAR_API_KEY
        sync: false
      - key: WEATHERAPI_KEY
        sync: false
